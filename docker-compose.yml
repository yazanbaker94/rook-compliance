services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rook
      POSTGRES_USER: rook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rook -d rook"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    environment:
      PORT: 4000
      DATA_MODE: postgres
      DATABASE_URL: postgresql://rook:${POSTGRES_PASSWORD}@postgres:5432/rook
      CORS_ORIGINS: https://swoop.video,https://rook-compliance-demo.yazanbaker.chatgpt.site
    ports:
      - "127.0.0.1:4100:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  document-ai:
    build:
      context: ./services/ai
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: https://swoop.video/corvus
    environment:
      NEXT_PUBLIC_API_URL: https://swoop.video/corvus
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
